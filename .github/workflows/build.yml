name: Build MatTerm

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Check terminal parser
        env:
          MATTERM_TERMINAL_PHASE: parser
        run: ./Scripts/check-terminal.sh

      - name: Check PTY pipeline
        env:
          MATTERM_TERMINAL_PHASE: pty
        run: ./Scripts/check-terminal.sh

      - name: Check terminal performance
        env:
          MATTERM_TERMINAL_PHASE: performance
        run: ./Scripts/check-terminal.sh

      - name: Check app PTY session
        env:
          MATTERM_TERMINAL_PHASE: app-pty
        run: ./Scripts/check-terminal.sh

      - name: Check appearance fallback
        run: ./Scripts/check-appearance.sh

      - name: Build arm64 binary
        env:
          MATTERM_SKIP_CHECKS: "1"
          MATTERM_BUILD_PHASE: arm64
        run: ./Scripts/build-app.sh

      - name: Build x86_64 binary
        env:
          MATTERM_SKIP_CHECKS: "1"
          MATTERM_BUILD_PHASE: x86_64
        run: ./Scripts/build-app.sh

      - name: Merge universal binary
        env:
          MATTERM_SKIP_CHECKS: "1"
          MATTERM_BUILD_PHASE: merge
        run: ./Scripts/build-app.sh

      - name: Generate app icon
        env:
          MATTERM_SKIP_CHECKS: "1"
          MATTERM_BUILD_PHASE: icon
        run: ./Scripts/build-app.sh

      - name: Sign app bundle
        env:
          MATTERM_SKIP_CHECKS: "1"
          MATTERM_BUILD_PHASE: sign
        run: ./Scripts/build-app.sh

      - name: Validate universal app
        run: ./Scripts/validate-app.sh

      - name: Sign and notarize release
        if: ${{ env.APPLE_CERTIFICATE_P12_BASE64 != '' && env.APPLE_CERTIFICATE_PASSWORD != '' && env.APPLE_SIGNING_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != '' }}
        run: ./Scripts/sign-and-notarize.sh

      - name: Package ad-hoc build
        if: ${{ env.APPLE_CERTIFICATE_P12_BASE64 == '' || env.APPLE_CERTIFICATE_PASSWORD == '' || env.APPLE_SIGNING_IDENTITY == '' || env.APPLE_ID == '' || env.APPLE_TEAM_ID == '' || env.APPLE_APP_PASSWORD == '' }}
        run: ./Scripts/package-app.sh

      - name: Validate final app
        run: ./Scripts/validate-app.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatTerm-macos26-universal
          path: Artifacts/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Artifacts/*.zip --repo "$GITHUB_REPOSITORY" --generate-notes
